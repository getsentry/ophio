[package]
name = "ophio-bindings"
version = "1.3.1"
publish = false
edition = "2021"

[lib]
name = "_bindings"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.79"
memmap2 = { version = "0.9.11", features = ["stable_deref_trait"] }
proguard = { version = "5.10.5", features = ["uuid"] }
pyo3 = { version = "0.30.1", features = [
    "anyhow",
    "extension-module",
    "serde",
    "abi3-py310",
] }
rust-ophio = { path = "../rust" }
smol_str = "0.2.0"
yoke = { version = "0.8.3", features = ["derive"] }
